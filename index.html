<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique English School | Excellence in Education</title>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      var div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.height = '100%';
      div.style.backgroundColor = 'white';
      div.style.color = 'red';
      div.style.padding = '20px';
      div.style.zIndex = '9999';
      div.style.overflow = 'scroll';
      div.style.fontSize = '12px';
      div.style.fontFamily = 'monospace';
      div.innerHTML = '<h1>JS Error Caught:</h1><p>' + msg + '</p><p>URL: ' + url + '</p><p>Line: ' + lineNo + ', Col: ' + columnNo + '</p><p>Stack: ' + (error ? error.stack : 'N/A') + '</p><button onclick="window.location.reload()" style="padding: 10px; background: #7f1d1d; color: white; border: none; border-radius: 5px;">Reload App</button>';
      document.body.appendChild(div);
      return false;
    };
    window.addEventListener('unhandledrejection', function (event) {
      window.onerror('Unhandled Promise Rejection: ' + event.reason, '', 0, 0, event.reason);
    });
  </script>
  <script src="https://cdn.tailwindcss.com" defer></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --school-burgundy: #7f1d1d;
      --school-burgundy-light: #991b1b;
      --school-cream: #fefaf2;
      --school-gold: #b45309;
      --school-gold-light: #d97706;
      --slate-950: #020617;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--school-cream);
      color: var(--slate-950);
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    .serif-font {
      font-family: 'Playfair Display', serif;
    }

    .bg-school-burgundy {
      background-color: var(--school-burgundy);
    }

    .text-school-burgundy {
      color: var(--school-burgundy);
    }

    .border-school-gold {
      border-color: var(--school-gold);
    }

    .text-school-gold {
      color: var(--school-gold);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--school-cream);
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 10px;
      border: 2px solid var(--school-cream);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--school-burgundy);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    /* Utility animations */
    @keyframes subtle-zoom {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.05);
      }
    }

    .animate-subtle-zoom {
      animation: subtle-zoom 20s infinite alternate ease-in-out;
    }

    .hero-gradient {
      background: linear-gradient(135deg, rgba(127, 29, 29, 0.95) 0%, rgba(127, 29, 29, 0.7) 50%, transparent 100%);
    }

    /* Card Hover Effects */
    .premium-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .premium-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgba(127, 29, 29, 0.15);
    }
  </style>
</head>

<body class="text-slate-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
